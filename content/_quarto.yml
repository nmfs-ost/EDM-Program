project:
  type: website
  output-dir: ../docs
  resources:
    - "images/"

website:
  title: "Fisheries EDM Program"
  search: false
  repo-url: https://github.com/nmfs-ost/EDM-Program
  repo-actions: [issue]
  navbar:
    title: "Fisheries EDM Program"
    logo: "images/image_9085aa.png" # 1. Added the logo to the navbar here
    background: primary
    search: false
    right:
      - icon: github
        href: https://github.com/nmfs-ost/EDM-Program
        aria-label: "View source on GitHub"
      - text: "Report an Issue"
        icon: bug
        href: https://github.com/nmfs-ost/EDM-Program/issues/new
        aria-label: "Open a GitHub issue"
  page-footer:
    left: |
      Fisheries EDM Program · [NOAA.gov](https://www.noaa.gov) · [Privacy Policy](https://www.noaa.gov/protecting-your-privacy) · [Accessibility Statement](https://www.noaa.gov/accessibility) · [Disclaimer](https://www.noaa.gov/disclaimer)
    right: "Built with [Quarto](https://quarto.org) · [USA.gov](https://www.usa.gov)"

format:
  html:
    theme:
      light:
        - cosmo
        - custom.scss
    toc: true
    toc-title: "On this page"
    toc-location: right
    number-sections: false
    code-fold: true
    grid:                # 2. Replaced page-layout: full with grid width
      body-width: 1100px # This expands the center while keeping text readable
    html-math-method: plain
    include-after-body: sidebar-hover.html